name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check api/

      - name: Unit tests
        run: |
          pip install -r api/requirements.txt
          cd api && python -m pytest tests/ -v
        env:
          DATA_DIR: /tmp/soc_ci_data

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (requires committed lockfile)
        run: |
          cd frontend
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t soc-llm-api-ci ./api

      - name: Build frontend image
        run: docker build -t soc-llm-frontend-ci ./frontend